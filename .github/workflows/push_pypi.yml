name: push_pypi

# Publish to PyPI when a GitHub release is published (one release = one
# PyPI version = one git tag). The tests run first, on the released commit.

on:
  release:
    types: [published]

jobs:

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries (headless PySide6 / pyqtgraph)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1
      - name: Install package with test and Qt extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,qt]" PySide6
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -ra

  build:
    name: build sdist and wheel
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Check that the release tag matches the package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "package version: $VERSION   release tag: $GITHUB_REF_NAME"
          test "v$VERSION" = "$GITHUB_REF_NAME" || test "$VERSION" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/registration1d
    permissions:
      id-token: write      # trusted publishing (no API token stored in the repository)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
